x-base-bot: &base-bot
  image: ghcr.io/tf2-automatic/bot:latest
  restart: unless-stopped
  depends_on:
    - rabbitmq
    - bot-manager
    - seaweed
  expose:
    - '3000'
  environment: &rmq-redis-env	
    REDIS_HOST: 'redis'
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    RABBITMQ_HOST: 'rabbitmq'
    RABBITMQ_PORT: 5672
    RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
    RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    RABBITMQ_VHOST: ''

volumes:
  rabbitmq:
  redis:
  seaweed-data:

services:
  rabbitmq:
    image: rabbitmq:3.9.28-management-alpine
    expose:
      - '5672'
    ports:
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - 'rabbitmq:/var/lib/rabbitmq'
    healthcheck:
      test: rabbitmq-diagnostics ping
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 30s
      start_interval: 10s

  # Init container to create the bucket in SeaweedFS before the bots start
  seaweed-init:
    image: curlimages/curl
    user: root
    command: >
      sh -c "
        echo 'Waiting for Filer...';
        until curl -s http://seaweed:8888/ > /dev/null; do sleep 2; done;
        echo 'Creating bucket...';
        curl -X POST http://seaweed:8888/buckets/tf2-automatic/;
        echo 'Done!';
      "

  seaweed:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: 'server -s3 -s3.config=/etc/seaweedfs/s3_config.json -dir=/data -s3.allowEmptyFolder=true'
    ports:
      - '8333:8333' # S3 API
      - '9333:9333' # Master UI
      - '8888:8888' # Filer UI
    volumes:
      - 'seaweed-data:/data'
      - './s3_config.json:/etc/seaweedfs/s3_config.json:ro'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9333/cluster/status"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 0s

  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis:/data

  bot-manager:
    image: ghcr.io/tf2-automatic/bot-manager:latest
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - redis
    ports:
      - '3000:3000'
    environment:
      <<: *rmq-redis-env

  app:
    image: ghcr.io/zeusjunior/tf2-automatic-app-starter:master
    # Uncomment the following lines if you want to build the image from source instead of using the prebuilt image
    # build:
    #   context: ./app
    #   dockerfile: Dockerfile
    #   args:
    #     - NODE_AUTH_TOKEN=${NODE_AUTH_TOKEN}
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - bot-manager
    environment:
      <<: *rmq-redis-env
    command: yarn --cwd /app start:dev
    volumes:
      - './app:/app'
      - './app/node_modules:/app/node_modules'

  # Copy this block for each bot you want to run, but make sure to change the first port, name and the env_file
  bot1:
    <<: *base-bot
    container_name: bot-${BOT1}
    ports:
      - '3001:3000'
    env_file: 
      - './bots/bot1.env'